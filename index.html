<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdCoin · watch ads & earn</title>
  <!-- FontAwesome for icons (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b1120 0%, #141e30 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .app-container {
      max-width: 1200px;
      width: 100%;
      background: rgba(18, 26, 40, 0.8);
      backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 2rem;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 215, 0, 0.15);
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      background: #f5b342;
      background: linear-gradient(135deg, #f7d44a, #e6a017);
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #0b0f17;
      box-shadow: 0 8px 16px -4px rgba(245, 180, 66, 0.3);
    }

    .logo h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #e0e9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .coin-balance {
      background: rgba(10, 18, 30, 0.8);
      border: 1px solid rgba(245, 180, 66, 0.5);
      border-radius: 100px;
      padding: 0.65rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.5);
    }

    .coin-balance i {
      color: #f5b342;
      font-size: 1.8rem;
      filter: drop-shadow(0 0 6px rgba(245, 180, 66, 0.6));
    }

    .coin-balance .amount {
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .coin-balance .label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9aa9bb;
      font-weight: 500;
      margin-left: 0.25rem;
    }

    /* main grid */
    .dashboard {
      display: grid;
      grid-template-columns: 1.2fr 0.9fr;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    /* ad player */
    .ad-section {
      background: #0e1625;
      border-radius: 2rem;
      padding: 1.5rem;
      border: 1px solid #1f2b3c;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
    }

    .ad-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .ad-header h2 {
      color: #d9e2ef;
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .ad-header h2 i {
      color: #f5b342;
    }

    .badge-live {
      background: rgba(245, 180, 66, 0.15);
      color: #f5b342;
      border-radius: 40px;
      padding: 0.25rem 0.8rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: 1px solid rgba(245, 180, 66, 0.3);
    }

    .ad-player {
      background: #050a12;
      border-radius: 1.5rem;
      aspect-ratio: 16 / 9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: 1px solid #1e2b3c;
      box-shadow: 0 0 0 1px rgba(245, 180, 66, 0.1), 0 20px 30px -15px black;
      margin-bottom: 1.5rem;
    }

    .ad-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      color: #5d738b;
      transition: all 0.2s;
    }

    .ad-placeholder i {
      font-size: 4rem;
      color: #31465e;
    }

    .ad-placeholder p {
      font-size: 1rem;
      font-weight: 400;
      color: #6b7f98;
    }

    .ad-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(245, 180, 66, 0.08), transparent 70%);
      pointer-events: none;
    }

    .ad-progress {
      width: 100%;
      height: 6px;
      background: #1b2637;
      border-radius: 100px;
      margin-top: 1rem;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #f5b342, #ffd966);
      border-radius: 100px;
      transition: width 0.1s linear;
    }

    .ad-timer {
      display: flex;
      justify-content: space-between;
      color: #b7c9e0;
      font-size: 0.9rem;
      font-weight: 500;
      margin-top: 0.5rem;
    }

    .ad-timer .reward-preview {
      color: #f5b342;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* buttons */
    .btn {
      border: none;
      border-radius: 100px;
      padding: 0.9rem 1.8rem;
      font-weight: 700;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f7d44a, #e6a017);
      color: #0b0f17;
      box-shadow: 0 10px 20px -6px rgba(245, 180, 66, 0.3);
      width: 100%;
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #ffe066, #f0b32e);
      transform: scale(1.01);
      box-shadow: 0 14px 26px -8px rgba(245, 180, 66, 0.5);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      filter: grayscale(0.4);
      box-shadow: none;
    }

    .btn-secondary {
      background: #1b2537;
      color: #d0dded;
      border: 1px solid #2d3b51;
      box-shadow: 0 6px 12px -6px black;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #222f45;
      border-color: #435a78;
      color: white;
    }

    .btn-secondary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-withdraw {
      background: linear-gradient(135deg, #1f2e44, #121e2e);
      border: 1px solid #3f5777;
      color: #eef5ff;
      box-shadow: 0 8px 18px -8px black;
    }

    .btn-withdraw:hover:not(:disabled) {
      background: #263850;
      border-color: #6e8db0;
    }

    .btn-withdraw:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* withdraw panel */
    .withdraw-panel {
      background: #0e1625;
      border-radius: 2rem;
      padding: 1.8rem;
      border: 1px solid #1f2b3c;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .withdraw-panel h3 {
      color: #d9e2ef;
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .withdraw-panel h3 i {
      color: #f5b342;
    }

    .withdraw-target {
      background: #0b121e;
      border-radius: 1.5rem;
      padding: 1.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
      border: 1px solid #263143;
    }

    .target-label {
      color: #8b9bb2;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .target-amount {
      font-size: 3rem;
      font-weight: 800;
      color: #f5b342;
      line-height: 1.2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-shadow: 0 0 20px rgba(245, 180, 66, 0.3);
    }

    .target-amount i {
      font-size: 2.5rem;
    }

    .progress-bar-large {
      height: 14px;
      background: #1f2b3c;
      border-radius: 100px;
      margin: 1.5rem 0 0.75rem;
      overflow: hidden;
    }

    .progress-large-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f5b342, #ffdb7c);
      border-radius: 100px;
      transition: width 0.3s ease;
    }

    .withdraw-info {
      display: flex;
      justify-content: space-between;
      color: #9eb0c9;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
    }

    .withdraw-info span strong {
      color: #eef5ff;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1rem 0 1rem;
      color: #8196b0;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .history-list {
      background: #0b121e;
      border-radius: 1.2rem;
      padding: 0.5rem;
      border: 1px solid #1f2b3c;
      max-height: 150px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #192233;
      font-size: 0.9rem;
      color: #cbdae9;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-item .coins-earned {
      color: #f5b342;
      font-weight: 700;
    }

    .history-item .time {
      color: #6a7e98;
      font-size: 0.8rem;
    }

    .empty-history {
      color: #4e617b;
      text-align: center;
      padding: 1.5rem;
      font-style: italic;
    }

    /* toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e2e44;
      color: #eef5ff;
      padding: 1rem 2rem;
      border-radius: 100px;
      font-weight: 500;
      box-shadow: 0 20px 35px -10px black;
      border: 1px solid #3f5a7a;
      backdrop-filter: blur(8px);
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      pointer-events: none;
      font-size: 0.95rem;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast i {
      color: #f5b342;
      font-size: 1.2rem;
    }

    /* responsive */
    @media (max-width: 900px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
      .app-container {
        padding: 1.5rem;
      }
      .coin-balance .amount {
        font-size: 1.6rem;
      }
    }

    @media (max-width: 500px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      .coin-balance {
        width: 100%;
        justify-content: center;
      }
      .logo h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <i class="fas fa-play-circle"></i>
      </div>
      <h1>AdCoin</h1>
    </div>
    <div class="coin-balance">
      <i class="fas fa-coins"></i>
      <span class="amount" id="coinDisplay">0</span>
      <span class="label">coins</span>
    </div>
  </div>

  <!-- Dashboard grid -->
  <div class="dashboard">
    <!-- Ad section -->
    <div class="ad-section">
      <div class="ad-header">
        <h2><i class="fas fa-video"></i> Watch & earn</h2>
        <span class="badge-live"><i class="fas fa-circle" style="font-size: 0.5rem; margin-right: 0.3rem;"></i> LIVE</span>
      </div>

      <div class="ad-player" id="adPlayer">
        <div class="ad-placeholder" id="adPlaceholder">
          <i class="fas fa-play-circle"></i>
          <p>Press play to watch ad</p>
        </div>
        <div class="ad-overlay"></div>
        <!-- progress bar inside player (small) -->
      </div>

      <!-- progress & timer -->
      <div class="ad-progress">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="ad-timer">
        <span id="timerDisplay">0s / 15s</span>
        <span class="reward-preview"><i class="fas fa-coins"></i> +5 coins</span>
      </div>

      <button class="btn btn-primary" id="watchBtn" style="margin-top: 1.5rem;">
        <i class="fas fa-play"></i> Watch ad (15s) · earn 5 coins
      </button>
    </div>

    <!-- Withdraw panel -->
    <div class="withdraw-panel">
      <h3><i class="fas fa-hand-holding-usd"></i> Withdraw</h3>

      <div class="withdraw-target">
        <div class="target-label">Withdrawal threshold</div>
        <div class="target-amount">
          <i class="fas fa-coins"></i> 200
        </div>
        <div class="progress-bar-large">
          <div class="progress-large-fill" id="withdrawProgressFill"></div>
        </div>
        <div class="withdraw-info">
          <span>Your balance: <strong id="withdrawBalance">0</strong></span>
          <span>Needed: <strong>200</strong></span>
        </div>
      </div>

      <button class="btn btn-withdraw" id="withdrawBtn" disabled>
        <i class="fas fa-money-bill-wave"></i> Withdraw 200 coins
      </button>

      <div class="history-header">
        <span><i class="fas fa-history"></i> Recent earnings</span>
        <span id="totalEarnedLabel">0 total</span>
      </div>
      <div class="history-list" id="historyList">
        <div class="empty-history">No ads watched yet</div>
      </div>
    </div>
  </div>
</div>

<!-- toast -->
<div class="toast" id="toast">
  <i class="fas fa-check-circle"></i>
  <span id="toastMessage">Coins added!</span>
</div>

<script>
  (function() {
    // ---------- state ----------
    let coins = 0;
    const WITHDRAW_THRESHOLD = 200;
    const COINS_PER_AD = 5;
    const AD_DURATION = 15; // seconds (shortened for demo, but shows timer)
    
    let isWatching = false;
    let timerInterval = null;
    let progress = 0; // 0 to 100
    let secondsElapsed = 0;
    
    // history array (most recent first)
    let earningsHistory = []; // { coins: number, timestamp: Date }

    // ---------- DOM elements ----------
    const coinDisplay = document.getElementById('coinDisplay');
    const withdrawBalance = document.getElementById('withdrawBalance');
    const withdrawProgressFill = document.getElementById('withdrawProgressFill');
    const withdrawBtn = document.getElementById('withdrawBtn');
    const watchBtn = document.getElementById('watchBtn');
    
    const progressFill = document.getElementById('progressFill');
    const timerDisplay = document.getElementById('timerDisplay');
    const adPlaceholder = document.getElementById('adPlaceholder');
    const adPlayer = document.getElementById('adPlayer');
    
    const historyList = document.getElementById('historyList');
    const totalEarnedLabel = document.getElementById('totalEarnedLabel');
    
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');

    // ---------- helper functions ----------
    function showToast(message, isGood = true) {
      toastMessage.textContent = message;
      // change icon if needed
      const icon = toast.querySelector('i');
      if (isGood) {
        icon.className = 'fas fa-check-circle';
        icon.style.color = '#f5b342';
      } else {
        icon.className = 'fas fa-exclamation-circle';
        icon.style.color = '#ff8a7a';
      }
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    function updateUI() {
      // coin displays
      coinDisplay.textContent = coins;
      withdrawBalance.textContent = coins;
      
      // withdraw progress: percentage of threshold (capped at 100)
      const percent = Math.min((coins / WITHDRAW_THRESHOLD) * 100, 100);
      withdrawProgressFill.style.width = percent + '%';
      
      // enable/disable withdraw button
      withdrawBtn.disabled = coins < WITHDRAW_THRESHOLD;
      
      // update total earned label
      const totalEarned = earningsHistory.reduce((sum, entry) => sum + entry.coins, 0);
      totalEarnedLabel.textContent = totalEarned + ' total';
      
      // re-render history
      renderHistory();
    }

    function renderHistory() {
      if (earningsHistory.length === 0) {
        historyList.innerHTML = '<div class="empty-history">No ads watched yet</div>';
        return;
      }
      
      // show latest 6 entries
      const recent = earningsHistory.slice(0, 6);
      historyList.innerHTML = recent.map(entry => {
        const timeStr = entry.timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        return `
          <div class="history-item">
            <span><i class="fas fa-play-circle" style="color: #5f7a9a; margin-right: 0.6rem;"></i> Ad reward</span>
            <span class="coins-earned">+${entry.coins} <i class="fas fa-coins" style="font-size: 0.7rem;"></i></span>
            <span class="time">${timeStr}</span>
          </div>
        `;
      }).join('');
    }

    // add coins and update history
    function addCoins(amount) {
      coins += amount;
      
      // add to history
      earningsHistory.unshift({
        coins: amount,
        timestamp: new Date()
      });
      
      // keep history manageable
      if (earningsHistory.length > 20) earningsHistory.pop();
      
      updateUI();
    }

    // reset ad player after watch
    function resetAdPlayer() {
      isWatching = false;
      progress = 0;
      secondsElapsed = 0;
      progressFill.style.width = '0%';
      timerDisplay.textContent = `0s / ${AD_DURATION}s`;
      adPlaceholder.style.opacity = '1';
      adPlaceholder.innerHTML = `
        <i class="fas fa-play-circle"></i>
        <p>Press play to watch ad</p>
      `;
      watchBtn.disabled = false;
      watchBtn.innerHTML = `<i class="fas fa-play"></i> Watch ad (${AD_DURATION}s) · earn ${COINS_PER_AD} coins`;
      
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    // ---------- watch ad logic ----------
    function startWatchingAd() {
      if (isWatching) return;
      
      // reset any ongoing timer
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      
      // set watching state
      isWatching = true;
      secondsElapsed = 0;
      progress = 0;
      
      // update UI
      watchBtn.disabled = true;
      watchBtn.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Playing ad...`;
      
      // change placeholder to show "playing"
      adPlaceholder.style.opacity = '0.5';
      adPlaceholder.innerHTML = `
        <i class="fas fa-tv"></i>
        <p>Ad is playing...</p>
      `;
      
      // update progress & timer
      timerDisplay.textContent = `0s / ${AD_DURATION}s`;
      
      // start interval
      timerInterval = setInterval(() => {
        secondsElapsed += 0.1; // update every 100ms for smooth progress
        const percent = Math.min((secondsElapsed / AD_DURATION) * 100, 100);
        progressFill.style.width = percent + '%';
        
        // update timer display (whole seconds)
        const currentSec = Math.floor(secondsElapsed);
        timerDisplay.textContent = `${currentSec}s / ${AD_DURATION}s`;
        
        // check if ad finished
        if (secondsElapsed >= AD_DURATION) {
          // ad completed
          clearInterval(timerInterval);
          timerInterval = null;
          
          // reward
          addCoins(COINS_PER_AD);
          showToast(`+${COINS_PER_AD} coins earned!`, true);
          
          // reset after a tiny delay to show completion
          setTimeout(() => {
            resetAdPlayer();
          }, 400);
        }
      }, 100);
    }

    // ---------- withdraw ----------
    function handleWithdraw() {
      if (coins < WITHDRAW_THRESHOLD) {
        showToast(`You need ${WITHDRAW_THRESHOLD} coins to withdraw.`, false);
        return;
      }
      
      // simulate withdrawal
      const withdrawAmount = WITHDRAW_THRESHOLD;
      coins -= withdrawAmount;
      
      // add to history as withdrawal? we only track earnings, but we can reflect by clearing? 
      // Better: we add a note in toast. For simplicity, we also reset progress? we keep coins.
      // But we can show toast.
      showToast(`🎉 Withdrawal of ${WITHDRAW_THRESHOLD} coins requested! (demo)`, true);
      
      // Optionally, we can reset earnings history? No, keep it as total earned (but we deducted coins)
      // Actually we should keep track of total earned separately but it's fine.
      // But total earned label is sum of earningsHistory, not affected by withdrawal.
      // That's correct: total earned is lifetime.
      
      updateUI(); // this will disable withdraw button again if coins < threshold after withdrawal.
      
      // After withdrawal, if coins < threshold, disable button already done by updateUI
      // But we also want to give visual feedback.
      // We'll just call updateUI.
      
      // Also show a small reset of history? Not needed.
    }

    // ---------- event listeners ----------
    watchBtn.addEventListener('click', startWatchingAd);
    
    withdrawBtn.addEventListener('click', handleWithdraw);

    // initialize UI
    updateUI();

    // also adjust timer display initial
    timerDisplay.textContent = `0s / ${AD_DURATION}s`;

    // Ensure that when ad is finished we reset everything properly.
    // also handle page visibility to prevent weirdness (optional)

    // For demo: Preload some coins? No, start at zero.
    // But to allow users to test withdrawal quickly, maybe set initial coins to 0.
    // However they can watch ads. But ad duration is 15s each, to reach 200 they'd need 40 ads.
    // That's a lot. Let's make it easier: we can set initial coins to 195 so they only need one ad? 
    // But that's not realistic. The instruction says "withdraw at 200". 
    // I'll keep it honest but also add a small "bonus" of 100 coins if you click on the logo? Not required.
    // To make demo nicer, I'll start with 190 coins so they can see withdraw after 2 ads.
    // But it's better to show the mechanism clearly. I'll start with 100 coins to show progress.
